# DevPublisher Configuration File
version: '1'

# Source articles configuration
source:
  folder: 'content/blog'
  match: '**/*.md'

# Target platform settings
platforms:
  devto:
    enabled: true
    apiKey: '${DEVTO_API_KEY}'

  medium:
    enabled: false
    apiKey: '${MEDIUM_API_KEY}'

# Execution pipeline settings
pipeline:
  validators:
    - frontmatter
    - links
  transformers:
    - canonical-url
    - absolute-images
  tracking:
    provider: 'file'
    file: '.devpublisher/state.json'
