name: Feature Request
description: Suggest an idea or new publisher plugin for DevPublisher
title: '[FEAT]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a feature or new publisher plugin!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
